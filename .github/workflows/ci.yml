name: CI
on: [push,pull_request]
jobs:
 build:
  runs-on: ubuntu-latest
  services:
   mongo:
    image: mongo:8
    ports: ["27017:27017"]
   redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
  steps:
   - uses: actions/checkout@v5
   - uses: actions/setup-node@v5
     with:
      node-version: 22
   - run: npm install
   - run: npm run build
   - run: docker build -t solosync-backend .
