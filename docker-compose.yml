services:
 api:
  build: .
  ports: ["4000:4000"]
  environment:
   MONGODB_URI: mongodb://mongo:27017/solosync
   REDIS_URL: redis://redis:6379
   JWT_SECRET: local-development-secret
   FRONTEND_ORIGIN: http://localhost:5173
   NODE_ENV: development
  depends_on: [mongo,redis]
 mongo:
  image: mongo:8
 redis:
  image: redis:8-alpine